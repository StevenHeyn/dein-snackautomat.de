name: Referenzbilder HEIC in JPEG umwandeln
on:
  push:
    branches: [main]
    paths:
      - 'Referenz*.HEIC'
      - '.github/workflows/referenzen-bilder.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: HEIC-Konverter mit HEVC-Unterstützung installieren
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow pillow-heif
      - name: JPEG-Bilder erzeugen
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          from pillow_heif import register_heif_opener
          register_heif_opener()
          output = Path("assets/referenzen")
          output.mkdir(parents=True, exist_ok=True)
          for index in range(1, 11):
              source = Path(f"Referenz{index}.HEIC")
              if not source.exists():
                  continue
              with Image.open(source) as heic:
                  photo = ImageOps.exif_transpose(heic).convert("RGB")
                  destination = output / f"referenz-{index}.jpg"
                  photo.save(destination, format="JPEG", quality=92, optimize=True)
                  print(f"{source} -> {destination}: {photo.width}x{photo.height}")
          PY
      - name: Konvertierte Bilder speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/referenzen/referenz-{1..10}.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add web-compatible high-resolution reference images"
            git push
          fi
