name: Referenzbilder HEIC in JPEG umwandeln
on:
  push:
    branches: [main]
    paths:
      - 'Referenz*.HEIC'
      - '.github/workflows/referenzen-bilder.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: HEIC-Konverter installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libheif-examples
      - name: JPEG-Bilder erzeugen
        run: |
          mkdir -p assets/referenzen
          for n in $(seq 1 10); do
            source="Referenz${n}.HEIC"
            target="assets/referenzen/referenz-${n}.jpg"
            if [ -f "$source" ]; then
              heif-convert -q 92 "$source" "$target"
            fi
          done
      - name: Konvertierte Bilder speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/referenzen/referenz-{1..10}.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add web-compatible high-resolution reference images"
            git push
          fi
