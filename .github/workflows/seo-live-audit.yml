name: SEO-Indexierbarkeit der Live-Sitemap prüfen
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefen:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sitemap und öffentliche Googlebot-Signale kontrollieren
        run: python3 scripts/audit-indexability.py
